# Container release: build and test on every pull request; on main and on a
# version tag, publish a multi-arch (amd64 + arm64) image to GHCR, signed
# with cosign, with a syft SBOM and build provenance attached.
#
# GHCR needs only the job's own GITHUB_TOKEN. Docker Hub is not a target
# (the old workflow never published there); switching it on is one input,
# with the credentials in Doppler (project yomama-as-a-service, config ci).
# The jobs live in ChiefGyk3D/git-your-ship-together.
#
# Image: ghcr.io/chiefgyk3d/yomama-as-a-service
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of `latest` from main so base-image fixes reach the
    # published image between commits. Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@5df66539de085aff73dcf1f2957615689b846298 # v1.3.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      docker-test-command: docker run --rm "$IMAGE" python -c "import yo_mama; print('Import successful')"
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
